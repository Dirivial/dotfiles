exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = awww img ~/.config/hypr/hyprpaper/what-expanded.gif
exec-once = hyprsunset  2>&1 > ~/hyprsunsetlog.txt
exec-once = waybar

exec-once = [workspace 0 silent] discord
exec-once = [workspace 1 silent] gimp
exec-once = [workspace 2 silent] google-chrome-stable
exec-once = [workspace 3 silent] alacritty
exec-once = [workspace 6 silent] spotify-launcher
exec-once = [workspace 8 silent] obsidian
